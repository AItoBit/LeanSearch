[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leansearch"
version = "0.1.0"
description = "Search-based formal reasoning agent for Lean 4"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leansearch = "leansearch.cli:main"

[tool.setuptools.packages.find]
include = ["leansearch*"]

[tool.setuptools.package-data]
leansearch = ["environment/*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lean: requires a built Lean REPL (vendor/repl)",
    "slow: long-running stress tests",
]
